name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Sintaxe dos Scripts Shell
        run: |
          bash -n setup.sh
          bash -n terminal/terminal-emulator.sh

      - name: Validar desktop file
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils
            desktop-file-validate terminal/terminal-emulator.desktop

      - name: Stylua
        run: |
          curl -fsSL https://github.com/JohnnyMorganz/StyLua/releases/download/v2.0.2/stylua-linux-x86_64.zip -o /tmp/stylua.zip
          unzip -oq /tmp/stylua.zip -d /tmp stylua
          chmod +x /tmp/stylua
          /tmp/stylua --check

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Neovim
        run: |
          curl -fL https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz -o /tmp/nvim.tar.gz
          sudo mkdir -p /opt/nvim
          sudo tar xzf /tmp/nvim.tar.gz -C /opt/nvim --strip-components=1
          sudo ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim
          nvim --version | head -1

      - name: Smoke Test (Carrega config e plugins)
        run: |
          mkdir -p ~/.config
          ln -sfn "$GITHUB_WORKSPACE" ~/.config/lazyvim
          NVIM_APPNAME=lazyvim timeout 300 nvim --headless \
          "+lua local ok, res = pcall(function() return vim.wait(150000, function() return require('lazy').stats().loaded > 0 end) end); if not ok then print('ERRO: ' .. tostring(res)) end; os.exit(ok and res and 0 or 1)" \
            > /tmp/smoke.log 2>&1 || { tail -50 /tmp/smoke.log; exit 1; }
          tail -5 /tmp/smoke.log
